name: Automatic patched APK updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: automatic-patched-apks
  cancel-in-progress: false

jobs:
  build:
    name: Check and build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: youtube
            package: com.google.android.youtube
            patch_repo: https://github.com/MorpheApp/morphe-patches
          - name: reddit
            package: com.reddit.frontpage
            patch_repo: https://github.com/MorpheApp/morphe-patches
          - name: photos
            package: com.google.android.apps.photos
            patch_repo: https://github.com/rushiranpise/morphe-patches
          - name: instagram
            package: com.instagram.android
            patch_repo: https://github.com/SysAdminDoc/HushGram

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install APK downloader
        run: |
          set -euo pipefail
          cargo install apkeep --locked
          apkeep --version

      - name: Download latest stable Morphe CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools input output
          gh release download --repo MorpheApp/morphe-desktop --pattern '*-all.jar' --dir tools
          JAR="$(find tools -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          echo "MORPHE_JAR=$JAR" >> "$GITHUB_ENV"
          java -jar "$JAR" --version

      - name: Resolve latest compatible stable version
        id: version
        env:
          PATCHES: ${{ matrix.patch_repo }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          java -jar "$MORPHE_JAR" list-versions --patches "$PATCHES" -f "$PACKAGE" | tee compatible.txt
          VERSION="$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' compatible.txt | sort -Vu | tail -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No compatible stable version found for $PACKAGE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve patch tag and skip existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHES: ${{ matrix.patch_repo }}
          APP: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PATCH_REPO="\${PATCHES#https://github.com/}"
          PATCH_TAG="$(gh release list --repo "$PATCH_REPO" --limit 100 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName')"
          if [[ -z "$PATCH_TAG" || "$PATCH_TAG" == "null" ]]; then
            echo "::error::No stable patch release found in $PATCH_REPO"
            exit 1
          fi
          TAG="\${APP}-v\${VERSION}-\${PATCH_TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published: $TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New build required: $TAG"
          fi

      - name: Download compatible APK from APKPure
        if: steps.release.outputs.skip != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p input
          # apkeep supports APKPure but does not implement an APKMirror provider.
          # Pin the exact version selected by Morphe's compatibility list.
          apkeep -a "$PACKAGE@$VERSION" -d apk-pure input
          APK="$(find input -type f -name '*.apk' -size +1M -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::No APK downloaded. Split bundles require a separate merge step."
            find input -type f -ls
            exit 1
          fi
          echo "INPUT_APK=$APK" >> "$GITHUB_ENV"
          file "$APK"

      - name: Restore persistent signing key
        if: steps.release.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing.jks
          chmod 600 signing.jks
          test -s signing.jks

      - name: Patch, sign and verify
        if: steps.release.outputs.skip != 'true'
        env:
          PATCHES: ${{ matrix.patch_repo }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP: ${{ matrix.name }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "\${!value}" ]]; then echo "::error::Missing secret $value"; exit 1; fi
          done
          java -jar "$MORPHE_JAR" patch \
            --patches "$PATCHES" \
            --keystore signing.jks \
            --keystore-password "$KEYSTORE_PASSWORD" \
            --keystore-entry-alias "$KEY_ALIAS" \
            --keystore-entry-password "$KEY_PASSWORD" \
            --out "output/$APP.apk" \
            "$INPUT_APK"
          test -s "output/$APP.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "output/$APP.apk"
          sha256sum "output/$APP.apk" > "output/$APP-SHA256.txt"
          rm -f signing.jks

      - name: Publish app release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "output/$APP.apk" "output/$APP-SHA256.txt" \
            --title "$APP $VERSION patched" \
            --notes "Automatically built from the latest stable compatible APK and patch release. Signature verified before publication."
