name: Automatic patched APK updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: automatic-patched-apks
  cancel-in-progress: false

jobs:
  build:
    name: Check and build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: youtube
            package: com.google.android.youtube
            patch_repo: https://github.com/MorpheApp/morphe-patches
          - name: reddit
            package: com.reddit.frontpage
            patch_repo: https://github.com/MorpheApp/morphe-patches
          - name: photos
            package: com.google.android.apps.photos
            patch_repo: https://github.com/rushiranpise/morphe-patches
          - name: instagram
            package: com.instagram.android
            patch_repo: https://github.com/SysAdminDoc/HushGram

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install multi-source downloader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install PyGithub beautifulsoup4 curl-cffi requests
          git clone --depth 1 https://github.com/RookieEnough/Morphe-AutoBuilds.git downloader-upstream
          test -f downloader-upstream/src/downloader.py
          echo "UPSTREAM_DOWNLOADER=$GITHUB_WORKSPACE/downloader-upstream" >> "$GITHUB_ENV"
      - name: Wait for FlareSolverr
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8192/ >/dev/null; then
              echo "FlareSolverr is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::FlareSolverr did not become ready; direct mirror requests will still be attempted."

      - name: Download latest stable Morphe CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools input output
          gh release download --repo MorpheApp/morphe-desktop --pattern '*-all.jar' --dir tools
          JAR="$(find tools -maxdepth 1 -name '*-all.jar' -print -quit)"
          test -n "$JAR"
          echo "MORPHE_JAR=$JAR" >> "$GITHUB_ENV"
          java -jar "$JAR" --version

      - name: Resolve latest compatible stable version
        id: version
        env:
          PATCHES: ${{ matrix.patch_repo }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          java -jar "$MORPHE_JAR" list-versions --patches "$PATCHES" -f "$PACKAGE" | tee compatible.txt
          VERSION="$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' compatible.txt | sort -Vu | tail -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No compatible stable version found for $PACKAGE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve patch tag and skip existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHES: ${{ matrix.patch_repo }}
          APP: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PATCH_REPO="${PATCHES#https://github.com/}"
          PATCH_TAG="$(gh release list --repo "$PATCH_REPO" --limit 100 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName')"
          if [[ -z "$PATCH_TAG" || "$PATCH_TAG" == "null" ]]; then
            echo "::error::No stable patch release found in $PATCH_REPO"
            exit 1
          fi
          TAG="${APP}-v${VERSION}-${PATCH_TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published: $TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New build required: $TAG"
          fi

      - name: Guard Instagram against Plus or premium unlock patches
        if: matrix.name == 'instagram'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SysAdminDoc/HushGram/main/patches-list.json \
            -o hushgram-patches.json
          jq -r '[.patches[] | select((.name + " " + .description) | test("instagram[ -]?plus|unlock[^.]{0,50}(premium|paid|subscription)|premium[^.]{0,50}(feature|subscription)|subscription[^.]{0,50}(bypass|unlock)"; "i"))] | .[].name' \
            hushgram-patches.json > blocked-instagram-patches.txt
          if [[ -s blocked-instagram-patches.txt ]]; then
            echo "::error::HushGram now contains possible paid-feature unlock patches. Review and update the allowlist before building."
            cat blocked-instagram-patches.txt
            exit 1
          fi
          echo "No Instagram Plus/premium unlock patches found."

      - name: Download compatible APK using upstream multi-source downloader
        if: steps.release.outputs.skip != 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          APP: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          set -euo pipefail
          mkdir -p input
          cat > download_exact.py <<'PY'
          import json
          import logging
          import os
          import sys
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
          root = Path(os.environ["UPSTREAM_DOWNLOADER"])
          sys.path.insert(0, str(root))
          from src import downloader

          app = os.environ["APP"]
          package = os.environ["PACKAGE"]
          version = os.environ["VERSION"]
          configs = {
              "youtube": {
                  "org": "google-inc", "name": "youtube", "type": "APK",
                  "arch": "universal", "dpi": "nodpi", "package": package, "version": ""
              },
              "reddit": {
                  "org": "redditinc", "name": "reddit", "type": "BUNDLE",
                  "arch": "universal", "dpi": "120-640dpi", "package": package, "version": ""
              },
              "photos": {
                  "org": "google-inc", "name": "photos", "type": "BUNDLE",
                  "arch": "universal", "dpi": "120-640dpi", "package": package, "version": ""
              },
              "instagram": {
                  "org": "instagram", "name": "instagram-instagram", "type": "BUNDLE",
                  "arch": "universal", "dpi": "120-640dpi", "package": package, "version": ""
              },
          }
          if app not in configs or configs[app]["package"] != package:
              raise SystemExit(f"Unknown app/package mapping: {app} / {package}")

          # The reference downloader reads configs from apps/<provider>/<app>.json.
          # Give each provider the same package identity and version-independent slug metadata.
          for provider in ("apkmirror", "apkpure", "aptoide", "uptodown", "apkcombo", "apkfab"):
              folder = root / "apps" / provider
              folder.mkdir(parents=True, exist_ok=True)
              (folder / f"{app}.json").write_text(json.dumps(configs[app], indent=2))

          providers = ("apkmirror", "apkpure", "aptoide", "uptodown", "apkcombo", "apkfab")
          failures = []
          for provider in providers:
              logging.info("Attempting %s for %s version %s", provider, package, version)
              try:
                  result, resolved, candidates = downloader.download_platform(
                      app, provider, "", "", arch="universal", override_version=version
                  )
                  if result and result.is_file() and result.stat().st_size > 1_000_000:
                      # The override_version path pins every provider to this exact version.
                      if resolved != version:
                          raise RuntimeError(f"Provider returned {resolved!r}, expected {version!r}")
                      target = Path("input") / f"{app}-{version}{result.suffix.lower()}"
                      result.replace(target)
                      print(f"Downloaded exact version from {provider}: {target}")
                      print(f"INPUT_APK={target.resolve()}")
                      with open(os.environ["GITHUB_ENV"], "a") as env:
                          env.write(f"INPUT_APK={target.resolve()}\\n")
                      raise SystemExit(0)
                  failures.append(f"{provider}: no valid file")
              except SystemExit:
                  raise
              except Exception as exc:
                  logging.exception("%s failed", provider)
                  failures.append(f"{provider}: {type(exc).__name__}: {exc}")
          print("All providers failed:")
          for failure in failures:
              print(" -", failure)
          raise SystemExit(1)
          PY
          python download_exact.py
          test -s "$INPUT_APK"
          file "$INPUT_APK"

      - name: Restore persistent signing key
        if: steps.release.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing.jks
          chmod 600 signing.jks
          test -s signing.jks

      - name: Patch, sign and verify
        if: steps.release.outputs.skip != 'true'
        env:
          PATCHES: ${{ matrix.patch_repo }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP: ${{ matrix.name }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then echo "::error::Missing secret $value"; exit 1; fi
          done
          java -jar "$MORPHE_JAR" patch \
            --patches "$PATCHES" \
            --keystore signing.jks \
            --keystore-password "$KEYSTORE_PASSWORD" \
            --keystore-entry-alias "$KEY_ALIAS" \
            --keystore-entry-password "$KEY_PASSWORD" \
            --out "output/$APP.apk" \
            "$INPUT_APK"
          test -s "output/$APP.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "output/$APP.apk"
          sha256sum "output/$APP.apk" > "output/$APP-SHA256.txt"
          rm -f signing.jks

      - name: Publish app release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "output/$APP.apk" "output/$APP-SHA256.txt" \
            --title "$APP $VERSION patched" \
            --notes "Automatically built from the latest stable compatible APK and patch release. Signature verified before publication."
